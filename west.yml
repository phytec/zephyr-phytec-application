manifest:
  self:
    west-commands: scripts/west-commands.yml

  remotes:
    - name: phytec
      url-base: https://github.com/phytec

  projects:
    - name: zephyr
      remote: phytec
      repo-path: zephyr-phytec
#      revision: WIP/jma@phytec.com/v4.4.0-phynext
#      revision: f7a4352fb43ff289bfa38ebb600b74e973f2008c
#      revision: 28ae7e8bccbd593ab75890fc86f1e2a8f04f60ed
      revision: 9edd557451924c919bfeecbf4f836f475d412ac9
      import:
        # By using name-allowlist we can clone only the modules that are
        # strictly needed by the application.
        name-allowlist:
          - cmsis      # required by the ARM port
          - cmsis_6
          - hal_nxp    # required by NXP boards
          - lvgl
          - fatfs
